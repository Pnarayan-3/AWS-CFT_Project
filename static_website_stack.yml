AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation Template for Static Website Hosting with S3 and CloudFront'

Parameters:
  SiteDomain:
    Type: String
    Description: 'Domain name for your website (e.g., example.com)'
    Default: 'my-static-website'
  
  Environment:
    Type: String
    Description: 'Environment name'
    Default: 'dev'
    AllowedValues:
      - dev
      - staging
      - prod

Resources:
  # ==================== S3 Bucket ====================
  StaticWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${SiteDomain}-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${SiteDomain}-bucket'
        - Key: Environment
          Value: !Ref Environment

  # ==================== S3 Bucket Policy ====================
  # This policy allows CloudFront to access the S3 bucket
  StaticWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticWebsiteBucket
      PolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAI
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOAI}'
            Action: 's3:GetObject'
            Resource: !Sub '${StaticWebsiteBucket.Arn}/*'
          - Sid: AllowListBucket
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOAI}'
            Action: 's3:ListBucket'
            Resource: !GetAtt StaticWebsiteBucket.Arn

  # ==================== CloudFront Origin Access Identity ====================
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${SiteDomain}'

  # ==================== CloudFront Distribution ====================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        Comment: !Sub 'CloudFront Distribution for ${SiteDomain}'
        
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StaticWebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOAI}'
        
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          DefaultTTL: 300
          MaxTTL: 1200
        
        CacheBehaviors:
          # Cache HTML files for shorter duration
          - PathPattern: '*.html'
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            DefaultTTL: 60
            MaxTTL: 300
          
          # Cache assets longer
          - PathPattern: '*.{css,js,woff,woff2,ttf,eot,svg}'
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            DefaultTTL: 31536000  # 1 year for assets
            MaxTTL: 31536000
        
        # Error handling
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        
        Tags:
          - Key: Name
            Value: !Sub '${SiteDomain}-cloudfront'
          - Key: Environment
            Value: !Ref Environment

# ==================== Outputs ====================
Outputs:
  S3BucketName:
    Description: 'Name of the S3 bucket'
    Value: !Ref StaticWebsiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  S3BucketArn:
    Description: 'ARN of the S3 bucket'
    Value: !GetAtt StaticWebsiteBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'

  CloudFrontDistributionId:
    Description: 'CloudFront Distribution ID'
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  CloudFrontDomainName:
    Description: 'CloudFront Distribution Domain Name'
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-DomainName'

  UploadCommand:
    Description: 'Command to upload files to S3'
    Value: !Sub 'aws s3 cp index.html s3://${StaticWebsiteBucket}/ && aws s3 cp . s3://${StaticWebsiteBucket}/ --recursive'

  InvalidationCommand:
    Description: 'Command to invalidate CloudFront cache'
    Value: !Sub 'aws cloudfront create-invalidation --distribution-id ${CloudFrontDistribution} --paths "/*"'